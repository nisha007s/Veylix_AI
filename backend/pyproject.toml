[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veylix-backend"
version = "0.1.0"
description = "Veylix AI backend (FastAPI modular monolith)"
requires-python = ">=3.13"
# Direct dependencies only. Exact pinned versions live in requirements.txt,
# generated by pip-tools (see README "Setup").
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "tldextract",  # registered-domain extraction; used offline with its bundled suffix list
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",  # required by FastAPI's TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
